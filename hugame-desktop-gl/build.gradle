/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.5'
    lwjglNatives = 'natives-windows'
}

dependencies {
    api platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    api "io.semillita.hugame:hugame:0.0.1"
    api "io.semillita.hugame:hugame-desktop-window:0.0.1"
    api "org.lwjgl:lwjgl-opengl"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
}

group = 'io.semillita.hugame'
version = '0.0.1'
description = 'HuGame GL'

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}
